<!doctype html>
<html lang="sq">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div id="root" class="cv-row"></div>
<script>
  var L = window.Clover, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(L.Button, null, 'Porosit buqetën'),
    h(L.Button, { variant: 'quiet' }, 'Rezervo tavolinë'),
    h(L.Button, { variant: 'ghost' }, 'Shiko menunë'),
    h(L.Button, { size: 'sm' }, 'Porosit')));
</script>
</body>
</html>
